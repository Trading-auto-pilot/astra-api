  #     context: .
  #     dockerfile: strategyUtils/Dockerfile

  tickerscanner:
    build:
      context: .
      dockerfile: tickerScanner/Dockerfile

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile

  authservice:
    build:
      context: .
      dockerfile: authService/Dockerfile

  sma:
    build:
      context: .
      dockerfile: strategies/sma/Dockerfile

  sltp:
    build:
      context: .
      dockerfile: strategies/sltp/Dockerfile

