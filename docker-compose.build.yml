services:
  dbmanager:
    build:
      context: .
      dockerfile: DBManager/Dockerfile

  cachemanager:
    build:
      context: .
      dockerfile: cacheManager/Dockerfile

  alertingservice:
    build:
      context: .
      dockerfile: alertingService/Dockerfile

  capitalmanager:
    build:
      context: .
      dockerfile: capitalManager/Dockerfile

  livemarketlistener:
    build:
      context: .
      dockerfile: LiveMarketListener/Dockerfile

  orderlistner:
    build:
      context: .
      dockerfile: orderListner/Dockerfile

  ordersimulator:
    build:
      context: .
      dockerfile: orderSimulator/Dockerfile

  marketsimulator:
    build:
      context: .
      dockerfile: MarketSimulator/Dockerfile

  # NOTE: in docker-compose.paper.yml esiste anche "strategyutils" (expovin/strategyutils),
  # ma in questo repository non risulta presente un Dockerfile sorgente corrispondente.
  # strategyutils:
