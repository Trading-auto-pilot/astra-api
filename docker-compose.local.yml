  authservice:
    image: local/authservice:${AUTHSERVICE_VERSION:-latest}
    build:
      context: .
      dockerfile: authService/Dockerfile
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - DBMANAGER_URL=http://dbmanager:3002
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=Asia/Dubai
    networks:
      - trading_net
    depends_on:
      dbmanager:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    labels:
      - "traefik.enable=true"

      # 🔓 router PUBBLICO: /auth/login e /auth/validate
      - "traefik.http.routers.auth-public.rule=Host(`localhost`) && (PathPrefix(`/auth/login`) || PathPrefix(`/auth/validate`))"
      - "traefik.http.routers.auth-public.entrypoints=web"
      - "traefik.http.routers.auth-public.service=auth-svc"
      - "traefik.http.routers.auth-public.middlewares=cors-default@docker"

      # 🔐 router ADMIN: /auth/admin/... protetto da forwardAuth
      - "traefik.http.routers.auth-admin.rule=Host(`localhost`) && PathPrefix(`/auth/admin`)"
      - "traefik.http.routers.auth-admin.entrypoints=web"
      - "traefik.http.routers.auth-admin.middlewares=cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.auth-admin.service=auth-svc"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.auth-admin-preflight.rule=Host(`localhost`) && PathPrefix(`/auth/admin`) && Method(`OPTIONS`)"
      - "traefik.http.routers.auth-admin-preflight.entrypoints=web"
      - "traefik.http.routers.auth-admin-preflight.priority=10000"
      - "traefik.http.routers.auth-admin-preflight.service=auth-svc"
      - "traefik.http.routers.auth-admin-preflight.middlewares=cors-default@docker"

      - "traefik.http.services.auth-svc.loadbalancer.server.port=3015"

  astraai-frontend:
    image: local/astraai-frontend:${ASTRAAI_VERSION:-latest}
    build:
      context: ../astraai
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["frontend"]
    networks:
      - trading_net

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=trading_net"

      # Router frontend → http://localhost:8080
      - "traefik.http.routers.astraai-frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.astraai-frontend.entrypoints=web"

