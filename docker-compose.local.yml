name: "${ENV_NAME}"

services:

  traefik:
    # Workaround: DockerHub (docker.io) may return 500 in some networks.
    # Use GHCR mirror instead.
    image: ghcr.io/traefik/traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # Provider Docker
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=trading_net"
      # EntryPoints (solo HTTP)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # IBKR API Gatewar
      - "--providers.file.filename=/etc/traefik/dynamic.yml"

      # log (opzionale)
      - "--log.level=INFO"
      

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/etc/traefik/certs:ro

    networks:
      - trading_net

    labels:
      - "traefik.enable=true"

      # 🔐 middleware di autenticazione → chiama authService /auth/validate
      - "traefik.http.middlewares.auth-forward.forwardauth.address=http://authservice:3015/auth/validate"
      - "traefik.http.middlewares.auth-forward.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth-forward.forwardauth.authResponseHeaders=X-User-Id,X-Auth-Subject-Type,X-Api-Key-Id"

      # CORS Configuration (solo HTTP locale)
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowOriginList=http://localhost:8080,http://localhost:5173"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowMethods=GET,OPTIONS,PUT,POST,DELETE"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowCredentials=true"

  # ======================
  # CORE SERVICES (sempre ON)
  # ======================
  mysql:
    # Workaround: DockerHub (docker.io) may return 500 in some networks.
    # Use Amazon ECR public mirror instead.
    image: public.ecr.aws/docker/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      TZ: Asia/Dubai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3306:3306"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - trading-system_mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net

  redis:
    # Workaround: DockerHub (docker.io) may return 500 in some networks.
    # Use Amazon ECR public mirror instead.
    image: public.ecr.aws/docker/library/redis:7
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "no",
        "--save", "",
        "--maxmemory", "512mb",
        "--maxmemory-policy", "allkeys-lru"
      ]
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - TZ=Asia/Dubai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - trading_net


  ibkrgw-paper:
    image: local/ibkr-clientportal:1.0
    build:
      context: .
      dockerfile: IBKR_API_Gateway/Dockerfile
    restart: unless-stopped
    networks:
      - trading_net
    ports:
      - "5001:5000"
    volumes:
      - ./IBKR_API_Gateway/conf.local.expopaper.yaml:/opt/ibkr/root/conf.yaml:ro
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.ibkrgw-expopaper.rule=Host(`expopaper.localhost`)"
      - "traefik.http.routers.ibkrgw-expopaper.entrypoints=websecure"
      - "traefik.http.routers.ibkrgw-expopaper.tls=true"

      # ✅ middleware headers per “simulare” localhost:5000
      - "traefik.http.routers.ibkrgw-expopaper.middlewares=ibkrgw-expopaper-headers"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Host=localhost:5000"

      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.port=5000"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.scheme=https"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.serversTransport=ibkr-insecure@file"

      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-For=127.0.0.1"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Real-IP=127.0.0.1"

  ibkr-keepalive:
    image: local/ibkr-keepalive:latest
    build:
      context: .
      dockerfile: ibkr-keepalive/Dockerfile
    container_name: ibkr-keepalive
    network_mode: "service:ibkrgw-paper"
    depends_on:
      - ibkrgw-paper
    environment:
      - IBKR_BASE_URL=http://localhost:5000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - KEEPALIVE_INTERVAL_MS=45000
      - REQUEST_TIMEOUT_MS=5000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ibkr-keepalive.rule=Host(`localhost`) && PathPrefix(`/ibkr-keepalive`)"
      - "traefik.http.routers.ibkr-keepalive.entrypoints=web"
      - "traefik.http.services.ibkr-keepalive.loadbalancer.server.port=3019"
      - "traefik.http.middlewares.ibkr-keepalive-stripprefix.stripPrefix.prefixes=/ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive.middlewares=ibkr-keepalive-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.ibkr-keepalive-preflight.rule=Host(`localhost`) && PathPrefix(`/ibkr-keepalive`) && Method(`OPTIONS`)"
      - "traefik.http.routers.ibkr-keepalive-preflight.entrypoints=web"
      - "traefik.http.routers.ibkr-keepalive-preflight.priority=10000"
      - "traefik.http.routers.ibkr-keepalive-preflight.service=ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive-preflight.middlewares=ibkr-keepalive-stripprefix,cors-default@docker"

  ibkrgw-live:
    image: local/ibkr-clientportal:1.0
    build:
      context: .
      dockerfile: IBKR_API_Gateway/Dockerfile
    restart: unless-stopped
    networks:
      - trading_net
    ports:
      - "5002:5000"
    volumes:
      - ./IBKR_API_Gateway/conf.local.live.yaml:/opt/ibkr/root/conf.yaml:ro
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.ibkrgw-live.rule=Host(`expolive.localhost`)"
      - "traefik.http.routers.ibkrgw-live.entrypoints=websecure"
      - "traefik.http.routers.ibkrgw-live.tls=true"

      # ✅ middleware headers per “simulare” localhost:5000
      - "traefik.http.routers.ibkrgw-live.middlewares=ibkrgw-live-headers"
      - "traefik.http.middlewares.ibkrgw-live-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ibkrgw-live-headers.headers.customRequestHeaders.X-Forwarded-Host=localhost:5000"

      - "traefik.http.services.ibkrgw-live.loadbalancer.server.port=5000"
      - "traefik.http.services.ibkrgw-live.loadbalancer.server.scheme=https"
      - "traefik.http.services.ibkrgw-live.loadbalancer.serversTransport=ibkr-insecure@file"

      - "traefik.http.middlewares.ibkrgw-live-headers.headers.customRequestHeaders.X-Forwarded-For=127.0.0.1"
      - "traefik.http.middlewares.ibkrgw-live-headers.headers.customRequestHeaders.X-Real-IP=127.0.0.1"

  dbmanager:
    image: local/dbmanager:${DBMANAGER_VERSION:-latest}
    build:
      context: .
      dockerfile: DBManager/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - LOG_LEVEL=${LOG_LEVEL}
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Dubai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cache_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

  # ======================
  # MICROSERVIZI ABILITABILI (via profiles)
  # ======================

  cachemanager:
    image: local/cachemanager:${CACHEMANAGER_VERSION:-latest}
    build:
      context: .
      dockerfile: cacheManager/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - LOG_LEVEL=${LOG_LEVEL}
      - REDIS_URL=redis://redis:6379
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - IBKR_BRIDGE_URL=${IBKRBRIDGE_URL}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cachemanager_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net
    profiles: ["cachemanager"]
    labels:
      - "traefik.enable=true"
      # Router: http://localhost:8080/cachemanager/...
      - "traefik.http.routers.cachemanager.rule=Host(`localhost`) && PathPrefix(`/cachemanager`)"
      - "traefik.http.routers.cachemanager.entrypoints=web"
      # Service: porta interna del container
      - "traefik.http.services.cachemanager.loadbalancer.server.port=3006"
      # ✅ Middleware corretto: stripPrefix (camelCase)
      - "traefik.http.middlewares.cachemanager-stripprefix.stripPrefix.prefixes=/cachemanager"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.cachemanager.middlewares=cachemanager-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.cachemanager-preflight.rule=Host(`localhost`) && PathPrefix(`/cachemanager`) && Method(`OPTIONS`)"
      - "traefik.http.routers.cachemanager-preflight.entrypoints=web"
      - "traefik.http.routers.cachemanager-preflight.priority=10000"
      - "traefik.http.routers.cachemanager-preflight.service=cachemanager"
      - "traefik.http.routers.cachemanager-preflight.middlewares=cachemanager-stripprefix,cors-default@docker"

  capitalmanager:
    image: local/capitalmanager:${CAPITALMANAGER_VERSION:-latest}
    build:
      context: .
      dockerfile: capitalManager/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["capitalmanager"]

  alertingservice:
    image: local/alertingservice:${ALERTINGSERVICE_VERSION:-latest}
    build:
      context: .
      dockerfile: alertingService/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["alertingservice"]

  livemarketlistener:
    image: local/livemarketlistener:${LIVEMARKETLISTENER_VERSION:-latest}
    build:
      context: .
      dockerfile: LiveMarketListener/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["livemarketlistener"]

  orderlistner:
    image: local/orderlistner:${ORDERLISTNER_VERSION:-latest}
    build:
      context: .
      dockerfile: orderListner/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["orderlistner"]

  ordersimulator:
    image: local/ordersimulator:${ORDERSIMULATOR_VERSION:-latest}
    build:
      context: .
      dockerfile: orderSimulator/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["simulator"]

  marketsimulator:
    image: local/marketsimulator:${MARKETSIMULATOR_VERSION:-latest}
    build:
      context: .
      dockerfile: MarketSimulator/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["simulator"]

  sma:
    image: local/sma:${SMA_VERSION:-latest}
    build:
      context: .
      dockerfile: strategies/sma/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["sma"]

  sltp:
    image: local/sltp:${SLTP_VERSION:-latest}
    build:
      context: .
      dockerfile: strategies/sltp/Dockerfile
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["sltp"]

  scheduler:
    image: local/scheduler:${SCHEDULER_VERSION:-latest}
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    depends_on:
      dbmanager:
        condition: service_healthy
    networks:
      - trading_net
    profiles: ["scheduler"]
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=Asia/Dubai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3014/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # Router: http://localhost:8080/scheduler/...
      - "traefik.http.routers.scheduler.rule=Host(`localhost`) && PathPrefix(`/scheduler`)"
      - "traefik.http.routers.scheduler.entrypoints=web"
      - "traefik.http.services.scheduler.loadbalancer.server.port=3014"
      - "traefik.http.middlewares.scheduler-stripprefix.stripPrefix.prefixes=/scheduler"
      - "traefik.http.routers.scheduler.middlewares=scheduler-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.scheduler-preflight.rule=Host(`localhost`) && PathPrefix(`/scheduler`) && Method(`OPTIONS`)"
      - "traefik.http.routers.scheduler-preflight.entrypoints=web"
      - "traefik.http.routers.scheduler-preflight.priority=10000"
      - "traefik.http.routers.scheduler-preflight.service=scheduler"
      - "traefik.http.routers.scheduler-preflight.middlewares=scheduler-stripprefix,cors-default@docker"

  tickerscanner:
    image: local/tickerscanner:${TICKERSCANNER_VERSION:-latest}
    build:
      context: .
      dockerfile: tickerScanner/Dockerfile
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - FMP_API_KEY=${FMP_API_KEY}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["tickerscanner"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tickerscanner.rule=Host(`localhost`) && PathPrefix(`/tickerscanner`)"
      - "traefik.http.routers.tickerscanner.entrypoints=web"
      - "traefik.http.services.tickerscanner.loadbalancer.server.port=3013"
      - "traefik.http.middlewares.tickerscanner-stripprefix.stripPrefix.prefixes=/tickerscanner"
      - "traefik.http.routers.tickerscanner.middlewares=tickerscanner-stripprefix,cors-default@docker,auth-forward@docker"
      # Public glossary (no auth): http://localhost:8080/tickerscanner/glossary/<file>.json
      - "traefik.http.routers.tickerscanner-glossary.rule=Host(`localhost`) && PathPrefix(`/tickerscanner/glossary`)"
      - "traefik.http.routers.tickerscanner-glossary.entrypoints=web"
      - "traefik.http.routers.tickerscanner-glossary.priority=10010"
      - "traefik.http.routers.tickerscanner-glossary.service=tickerscanner"
      - "traefik.http.routers.tickerscanner-glossary.middlewares=tickerscanner-stripprefix,cors-default@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.tickerscanner-preflight.rule=Host(`localhost`) && PathPrefix(`/tickerscanner`) && Method(`OPTIONS`)"
      - "traefik.http.routers.tickerscanner-preflight.entrypoints=web"
      - "traefik.http.routers.tickerscanner-preflight.priority=10000"
      - "traefik.http.routers.tickerscanner-preflight.service=tickerscanner"
      - "traefik.http.routers.tickerscanner-preflight.middlewares=tickerscanner-stripprefix,cors-default@docker"

  decision-engine:
    image: local/decision-engine:${DECISIONENGINE_VERSION:-latest}
    build:
      context: .
      dockerfile: decision-engine/Dockerfile
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - MARKETDATASERVICE_URL=${MARKETDATASERVICE_URL}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["decision-engine"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3018/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decision-engine.rule=Host(`localhost`) && PathPrefix(`/decision-engine`)"
      - "traefik.http.routers.decision-engine.entrypoints=web"
      - "traefik.http.services.decision-engine.loadbalancer.server.port=3018"
      - "traefik.http.middlewares.decision-engine-stripprefix.stripPrefix.prefixes=/decision-engine"
      - "traefik.http.routers.decision-engine.middlewares=decision-engine-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.decision-engine-preflight.rule=Host(`localhost`) && PathPrefix(`/decision-engine`) && Method(`OPTIONS`)"
      - "traefik.http.routers.decision-engine-preflight.entrypoints=web"
      - "traefik.http.routers.decision-engine-preflight.priority=10000"
      - "traefik.http.routers.decision-engine-preflight.service=decision-engine"
      - "traefik.http.routers.decision-engine-preflight.middlewares=decision-engine-stripprefix,cors-default@docker"

  market-data-service:
    image: local/market-data-service:${MARKET_DATA_SERVICE_VERSION:-latest}
    build:
      context: .
      dockerfile: market-data-service/Dockerfile
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - IBKRGW_BASE_URL=${IBKRGW_BASE_URL}
      - IBKR_INSECURE_TLS=${IBKR_INSECURE_TLS}
      - IBKR_BRIDGE_URL=${IBKR_BRIDGE_URL}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["market-data-service"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-data-service.rule=Host(`localhost`) && PathPrefix(`/market-data-service`)"
      - "traefik.http.routers.market-data-service.entrypoints=web"
      - "traefik.http.services.market-data-service.loadbalancer.server.port=3020"
      - "traefik.http.middlewares.market-data-service-stripprefix.stripPrefix.prefixes=/market-data-service"
      - "traefik.http.routers.market-data-service.middlewares=market-data-service-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.market-data-service-preflight.rule=Host(`localhost`) && PathPrefix(`/market-data-service`) && Method(`OPTIONS`)"
      - "traefik.http.routers.market-data-service-preflight.entrypoints=web"
      - "traefik.http.routers.market-data-service-preflight.priority=10000"
      - "traefik.http.routers.market-data-service-preflight.service=market-data-service"
      - "traefik.http.routers.market-data-service-preflight.middlewares=market-data-service-stripprefix,cors-default@docker"

  redis-ws-bridge:
    image: local/redis-ws-bridge:${REDISWSBRIDGE_VERSION:-latest}
    build:
      context: .
      dockerfile: redisWsBridge/Dockerfile
    restart: unless-stopped
