  #     - "traefik.http.routers.dbmanager.entrypoints=web"
  #     - "traefik.http.services.dbmanager.loadbalancer.server.port=3002"
  #     - "traefik.http.middlewares.dbmanager-stripprefix.stripPrefix.prefixes=/dbmanager"
  #     - "traefik.http.routers.dbmanager.middlewares=dbmanager-stripprefix,cors-default@docker,auth-forward@docker"
  #     # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
  #     - "traefik.http.routers.dbmanager-preflight.rule=Host(`localhost`) && PathPrefix(`/dbmanager`) && Method(`OPTIONS`)"
  #     - "traefik.http.routers.dbmanager-preflight.entrypoints=web"
  #     - "traefik.http.routers.dbmanager-preflight.priority=10000"
  #     - "traefik.http.routers.dbmanager-preflight.service=dbmanager"
  #     - "traefik.http.routers.dbmanager-preflight.middlewares=dbmanager-stripprefix,cors-default@docker"

  # ======================
  # MICROSERVIZI ABILITABILI (via profiles)
  # ======================

  cachemanager:
    image: local/cachemanager:${CACHEMANAGER_VERSION:-latest}
    build:
      context: .
      dockerfile: cacheManager/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - DATAHUB_URL=http://datahub:3000
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - REDIS_URL=redis://redis:6379
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - IBKR_BRIDGE_URL=${IBKRBRIDGE_URL}
      - L3_USAGE_ALERT_PERCENT=${L3_USAGE_ALERT_PERCENT:-95}
      - TZ=${TIMEZONE}
    depends_on:
      datahub:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cachemanager_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net
    profiles: ["cachemanager"]
    labels:
      - "traefik.enable=true"
      # Router: http://localhost:8080/cachemanager/...
      - "traefik.http.routers.cachemanager.rule=Host(`localhost`) && PathPrefix(`/cachemanager`)"
      - "traefik.http.routers.cachemanager.entrypoints=web"
      # Service: porta interna del container
      - "traefik.http.services.cachemanager.loadbalancer.server.port=3006"
      # ✅ Middleware corretto: stripPrefix (camelCase)
      - "traefik.http.middlewares.cachemanager-stripprefix.stripPrefix.prefixes=/cachemanager"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.cachemanager.middlewares=cachemanager-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.cachemanager-preflight.rule=Host(`localhost`) && PathPrefix(`/cachemanager`) && Method(`OPTIONS`)"
      - "traefik.http.routers.cachemanager-preflight.entrypoints=web"
      - "traefik.http.routers.cachemanager-preflight.priority=10000"
      - "traefik.http.routers.cachemanager-preflight.service=cachemanager"
      - "traefik.http.routers.cachemanager-preflight.middlewares=cachemanager-stripprefix,cors-default@docker"

  alertingservice:
    image: local/alertingservice:${ALERTINGSERVICE_VERSION:-latest}
    build:
      context: .
      dockerfile: alertingService/Dockerfile
    restart: unless-stopped
    depends_on:
      - datahub
    networks:
      - trading_net
    profiles: ["alertingservice"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - DATAHUB_URL=http://datahub:3000
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=3008
      - ENV=${ENV}
      - MAX_RETRY_DELAY=${MAX_RETRY_DELAY}
      - REDIS_URL=redis://redis:6379
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_CONTENT_SID=${TWILIO_CONTENT_SID}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ALERTING_DEFAULT_TELEGRAM_CHAT_ID=${ALERTING_DEFAULT_TELEGRAM_CHAT_ID}
      - TELEGRAM_PARSE_MODE=${TELEGRAM_PARSE_MODE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ALERTING_LOGS_PATTERN=${ALERTING_LOGS_PATTERN}
      - ALERTING_WINDOW_SECONDS=${ALERTING_WINDOW_SECONDS}
      - ALERTING_MAX_PER_WINDOW=${ALERTING_MAX_PER_WINDOW}
      - ALERTING_DEDUP_SECONDS=${ALERTING_DEDUP_SECONDS}
      - ALERTING_DEFAULT_EMAIL_TO=${ALERTING_DEFAULT_EMAIL_TO}
      - TZ=${TIMEZONE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertingservice.rule=Host(`localhost`) && PathPrefix(`/alertingservice`)"
      - "traefik.http.routers.alertingservice.entrypoints=web"
      - "traefik.http.services.alertingservice.loadbalancer.server.port=3008"
      - "traefik.http.middlewares.alertingservice-stripprefix.stripPrefix.prefixes=/alertingservice"
      - "traefik.http.routers.alertingservice.middlewares=alertingservice-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.alertingservice-preflight.rule=Host(`localhost`) && PathPrefix(`/alertingservice`) && Method(`OPTIONS`)"
      - "traefik.http.routers.alertingservice-preflight.entrypoints=web"
      - "traefik.http.routers.alertingservice-preflight.priority=10000"
      - "traefik.http.routers.alertingservice-preflight.service=alertingservice"
      - "traefik.http.routers.alertingservice-preflight.middlewares=alertingservice-stripprefix,cors-default@docker"

  scheduler:
    image: local/scheduler:${SCHEDULER_VERSION:-latest}
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    depends_on:
      datahub:
        condition: service_healthy
    networks:
      - trading_net
    profiles: ["scheduler"]
    environment:
      - DATAHUB_URL=http://datahub:3000
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - INTERNAL_JWT_PRIVATE_KEY=${INTERNAL_JWT_PRIVATE_KEY}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - INTERNAL_JWT_ISS=${INTERNAL_JWT_ISS}
      - INTERNAL_JWT_EXP_SECONDS=${INTERNAL_JWT_EXP_SECONDS}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3014/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # Router: http://localhost:8080/scheduler/...
      - "traefik.http.routers.scheduler.rule=Host(`localhost`) && PathPrefix(`/scheduler`)"
      - "traefik.http.routers.scheduler.entrypoints=web"
      - "traefik.http.services.scheduler.loadbalancer.server.port=3014"
      - "traefik.http.middlewares.scheduler-stripprefix.stripPrefix.prefixes=/scheduler"
      - "traefik.http.routers.scheduler.middlewares=scheduler-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.scheduler-preflight.rule=Host(`localhost`) && PathPrefix(`/scheduler`) && Method(`OPTIONS`)"
      - "traefik.http.routers.scheduler-preflight.entrypoints=web"
      - "traefik.http.routers.scheduler-preflight.priority=10000"
      - "traefik.http.routers.scheduler-preflight.service=scheduler"
      - "traefik.http.routers.scheduler-preflight.middlewares=scheduler-stripprefix,cors-default@docker"

  tickerscanner:
    image: local/tickerscanner:${TICKERSCANNER_VERSION:-latest}
    build:
      context: .
      dockerfile: tickerScanner/Dockerfile
    restart: unless-stopped
    environment:
      - DATAHUB_URL=http://datahub:3000
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - FMP_API_KEY=${FMP_API_KEY}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - DEFAULT_JOB_TIMEZONE=America/New_York
      - SCHEDULER_TIMEZONE=America/New_York
      - TZ=${TIMEZONE}
      - SCAN_FMP_CONCURRENCY=${SCAN_FMP_CONCURRENCY}
      - SCAN_MOMENTUM_CONCURRENCY=${SCAN_MOMENTUM_CONCURRENCY}
      - SCAN_UPSERT_CONCURRENCY=${SCAN_UPSERT_CONCURRENCY}
    depends_on:
      datahub:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["tickerscanner"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tickerscanner.rule=Host(`localhost`) && PathPrefix(`/tickerscanner`)"
      - "traefik.http.routers.tickerscanner.entrypoints=web"
      - "traefik.http.services.tickerscanner.loadbalancer.server.port=3013"
      - "traefik.http.middlewares.tickerscanner-stripprefix.stripPrefix.prefixes=/tickerscanner"
      - "traefik.http.routers.tickerscanner.middlewares=tickerscanner-stripprefix,cors-default@docker,auth-forward@docker"
      # Public glossary (no auth): http://localhost:8080/tickerscanner/glossary/<file>.json
      - "traefik.http.routers.tickerscanner-glossary.rule=Host(`localhost`) && PathPrefix(`/tickerscanner/glossary`)"
      - "traefik.http.routers.tickerscanner-glossary.entrypoints=web"
      - "traefik.http.routers.tickerscanner-glossary.priority=10010"
      - "traefik.http.routers.tickerscanner-glossary.service=tickerscanner"
      - "traefik.http.routers.tickerscanner-glossary.middlewares=tickerscanner-stripprefix,cors-default@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.tickerscanner-preflight.rule=Host(`localhost`) && PathPrefix(`/tickerscanner`) && Method(`OPTIONS`)"
      - "traefik.http.routers.tickerscanner-preflight.entrypoints=web"
      - "traefik.http.routers.tickerscanner-preflight.priority=10000"
      - "traefik.http.routers.tickerscanner-preflight.service=tickerscanner"
