      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.auth-admin-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/auth/admin`) && Method(`OPTIONS`)"
      - "traefik.http.routers.auth-admin-preflight.entrypoints=websecure"
