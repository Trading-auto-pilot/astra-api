name: "${ENV}"

services:

  # ======================
  # CORE SERVICES (sempre ON)
  # ======================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT : ${MYSQL_PORT}
      MYSQL_HOST : ${MYSQL_HOST}
      ENV: ${ENV}
      TZ: ${TIMEZONE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3306:3306"
    depends_on:
      redis:
          condition: service_healthy
    volumes:
      - trading-system_mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--maxmemory", "512mb",
        "--maxmemory-policy", "volatile-lru"
      ]
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATAHUB_URL=${DATAHUB_URL}
      - ENV=${ENV}
      - TZ=${TIMEZONE}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - trading_net

  ibkrgw-paper:
    image: expovin/ibkr-clientportal:${IBKRGW_VERSION}
    restart: unless-stopped
    networks:
      - trading_net
      - traefik_web
    ports:
      - "5001:5000"
    volumes:
      - ./IBKR_API_Gateway/conf.local.expopaper.yaml:/opt/ibkr/root/conf.yaml:ro
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.ibkrgw-expopaper.rule=Host(`expopaper.localhost`)"
      - "traefik.http.routers.ibkrgw-expopaper.entrypoints=websecure"
      - "traefik.http.routers.ibkrgw-expopaper.tls=true"

      - "traefik.http.routers.ibkrgw-expopaper.middlewares=ibkrgw-expopaper-headers"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Host=localhost:5000"

      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.port=5000"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.scheme=https"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.serversTransport=ibkr-insecure@file"

      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-For=127.0.0.1"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Real-IP=127.0.0.1"

      # ibkr-keepalive condivide la rete con questo container (network_mode: service:ibkrgw-paper)
      # quindi le sue label Traefik devono stare qui, puntando alla porta 3019 sullo stesso host
      - "traefik.http.routers.ibkr-keepalive.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-keepalive`)"
      - "traefik.http.routers.ibkr-keepalive.entrypoints=websecure"
      - "traefik.http.routers.ibkr-keepalive.tls.certresolver=le"
      - "traefik.http.services.ibkr-keepalive.loadbalancer.server.port=3019"
      - "traefik.http.middlewares.ibkr-keepalive-stripprefix.stripPrefix.prefixes=/ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive.middlewares=ibkr-keepalive-stripprefix,trading-cors@docker,trading-auth@docker"
      - "traefik.http.routers.ibkr-keepalive-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-keepalive`) && Method(`OPTIONS`)"
      - "traefik.http.routers.ibkr-keepalive-preflight.entrypoints=websecure"
      - "traefik.http.routers.ibkr-keepalive-preflight.tls.certresolver=le"
      - "traefik.http.routers.ibkr-keepalive-preflight.priority=10000"
      - "traefik.http.routers.ibkr-keepalive-preflight.service=ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive-preflight.middlewares=ibkr-keepalive-stripprefix,trading-cors@docker"

  ibkr-keepalive:
    image: expovin/ibkr-keepalive:${IBKRKEEPALIVE_VERSION}
    network_mode: "service:ibkrgw-paper"
    depends_on:
      - ibkrgw-paper
    environment:
      - IBKR_BASE_URL=${IBKRGW_BASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - KEEPALIVE_INTERVAL_MS=45000
      - REQUEST_TIMEOUT_MS=8000
      - ENV=${ENV}
    restart: unless-stopped

  datahub:
    image: expovin/datahub:${DATAHUB_VERSION}
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CACHEMANAGER_URL=${CACHEMANAGER_URL}
      - ALERTINGSERVICE_URL=${ALERTINGMANAGER_URL}
      - TICKERSCANNER_URL=${TICKERSCANNER_URL}
      - SCHEDULER_URL=${SCHEDULER_URL}
      - AUTHSERVICE_URL=${AUTHSERVICE_URL}
      - SERVICECONTROLPLANE_URL=${SERVICECONTROLPLANE_URL}
      - IBKRBRIDGE_URL=${IBKRBRIDGE_URL}
      - DECISIONENGINE_URL=${DECISIONENGINE_URL}
      - IBKRKEEPALIVE_URL=${IBKRKEEPALIVE_URL}
      - LIQUIDITY_MANAGER_URL=${LIQUIDITY_MANAGER_URL}
      - MARKETDATASERVICE_URL=${MARKETDATASERVICE_URL}
      - BROKER_EXECUTOR_IBKR_URL=${BROKER_EXECUTOR_IBKR_URL}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - BODY_LIMIT=${BODY_LIMIT:-10mb}
      - TZ=${TIMEZONE}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net
      - traefik_web
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.trading-auth.forwardauth.address=http://authservice:3015/auth/validate"
      - "traefik.http.middlewares.trading-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.trading-auth.forwardauth.authResponseHeaders=X-User-Id,X-Auth-Subject-Type,X-Api-Key-Id"
      - "traefik.http.middlewares.trading-cors.headers.accessControlAllowOriginList=https://trading.expovin.it,https://api.trading.expovin.it,https://claude.ai,https://app.claude.ai,http://localhost:5173,http://localhost:8080"
      - "traefik.http.middlewares.trading-cors.headers.accessControlAllowMethods=GET,OPTIONS,PUT,POST,DELETE"
      - "traefik.http.middlewares.trading-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,X-Api-Key,Upgrade,Connection,Sec-WebSocket-Key,Sec-WebSocket-Version,Sec-WebSocket-Extensions,Sec-WebSocket-Accept"
      - "traefik.http.middlewares.trading-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.routers.datahub.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/datahub`)"
      - "traefik.http.routers.datahub.entrypoints=websecure"
      - "traefik.http.routers.datahub.tls.certresolver=le"
      - "traefik.http.services.datahub.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.datahub-stripprefix.stripPrefix.prefixes=/datahub"
      - "traefik.http.routers.datahub.middlewares=datahub-stripprefix,trading-cors@docker,trading-auth@docker"
      - "traefik.http.routers.datahub-settings.rule=Host(`api.trading.expovin.it`) && Path(`/datahub/settings`)"
      - "traefik.http.routers.datahub-settings.entrypoints=websecure"
      - "traefik.http.routers.datahub-settings.tls.certresolver=le"
      - "traefik.http.routers.datahub-settings.priority=10000"
      - "traefik.http.routers.datahub-settings.service=datahub"
      - "traefik.http.routers.datahub-settings.middlewares=datahub-stripprefix,trading-cors@docker"
      - "traefik.http.routers.datahub-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/datahub`) && Method(`OPTIONS`)"
      - "traefik.http.routers.datahub-preflight.entrypoints=websecure"
      - "traefik.http.routers.datahub-preflight.tls.certresolver=le"
      - "traefik.http.routers.datahub-preflight.priority=10000"
      - "traefik.http.routers.datahub-preflight.service=datahub"
      - "traefik.http.routers.datahub-preflight.middlewares=datahub-stripprefix,trading-cors@docker"

  # ======================
  # MICROSERVIZI ABILITABILI (via profiles)
  # ======================

  cachemanager:
    image: expovin/cachemanager:${CACHEMANAGER_VERSION}
    restart: unless-stopped
    environment:
      - DATAHUB_URL=${DATAHUB_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - REDIS_URL=${REDIS_URL}
      - ALERTINGSERVICE_URL=${ALERTINGSERVICE_URL}
      - ALPACA_MARKET_FEED=${ALPACA_MARKET_FEED}
      - ALPACA_REST_URL=${ALPACA_REST_URL}
      - ALPACA_TIMEOUT=${ALPACA_TIMEOUT}
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - BODY_LIMIT=${BODY_LIMIT:-20mb}
      - CACHEMANAGER_URL=${CACHEMANAGER_URL}
      - CAPITALMANAGER_URL=${CAPITALMANAGER_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CURRENT_MONTH_STALE_THRESHOLD_HOURS=${CURRENT_MONTH_STALE_THRESHOLD_HOURS}
      - DBMANAGER_URL=${DBMANAGER_URL}
      - FMP_API_KEY=${FMP_API_KEY}
      - HISTORICAL_PROVIDER=${HISTORICAL_PROVIDER}
      - IBKRBRIDGE_URL=${IBKRBRIDGE_URL}
      - IBKR_EXCHANGE=${IBKR_EXCHANGE}
      - LIVEMARKETLISTNER_URL=${LIVEMARKETLISTNER_URL}
      - L3_USAGE_ALERT_PERCENT=${L3_USAGE_ALERT_PERCENT:-95}
      - MARKETSIMULATOR_URL=${MARKETSIMULATOR_URL}
      - MAX_RETRY_DELAY=${MAX_RETRY_DELAY}
      - ORDERLISTNER_URL=${ORDERLISTNER_URL}
      - ORDERSIMULATOR_URL=${ORDERSIMULATOR_URL}
      - PORT=${PORT:-3006}
      - SLTP_URL=${SLTP_URL}
      - SMA_URL=${SMA_URL}
      - STRATEGYUTILS_URL=${STRATEGYUTILS_URL}
      - TICKERSCANNER_URL=${TICKERSCANNER_URL}
      - TZ=${TIMEZONE}
    depends_on:
      datahub:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cachemanager_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net
      - traefik_web
    profiles: ["cachemanager"]
    labels:
      - "traefik.enable=true"
      # Router: https://api.trading.expovin.it/cachemanager/...
      - "traefik.http.routers.cachemanager.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/cachemanager`)"
      - "traefik.http.routers.cachemanager.entrypoints=websecure"
      - "traefik.http.routers.cachemanager.tls.certresolver=le"
      # Service: porta interna del container
      - "traefik.http.services.cachemanager.loadbalancer.server.port=3006"
      # ✅ Middleware corretto: stripPrefix (camelCase)
      - "traefik.http.middlewares.cachemanager-stripprefix.stripPrefix.prefixes=/cachemanager"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.cachemanager.middlewares=cachemanager-stripprefix,trading-cors@docker,trading-auth@docker"

  decision-engine:
    image: expovin/decision-engine:${DECISIONENGINE_VERSION}
    restart: unless-stopped
    environment:
      - DATAHUB_URL=${DATAHUB_URL}
      - CACHEMANAGER_URL=${CACHEMANAGER_URL}
      - ALERTINGSERVICE_URL=${ALERTINGSERVICE_URL}
      - APP_ENV=${APP_ENV}
      - AUTHSERVICE_URL=${AUTHSERVICE_URL}
      - BREAKOUT_OPEN_BLOCK_MINUTES=${BREAKOUT_OPEN_BLOCK_MINUTES}
      - BROKER_EXECUTOR_IBKR_URL=${BROKER_EXECUTOR_IBKR_URL}
      - BROKER_EXECUTOR_URL=${BROKER_EXECUTOR_URL}
      - CAPITALMANAGER_URL=${CAPITALMANAGER_URL}
      - DBMANAGER_URL=${DBMANAGER_URL}
      - DECISIONENGINE_URL=${DECISIONENGINE_URL}
      - DE_DIVIDEND_BLOCK_DAYS=${DE_DIVIDEND_BLOCK_DAYS}
      - DE_DIVIDEND_GUARD_ENABLED=${DE_DIVIDEND_GUARD_ENABLED}
      - DE_DOLLARS_PER_TRADE=${DE_DOLLARS_PER_TRADE}
      - DE_EARNINGS_GUARD_ENABLED=${DE_EARNINGS_GUARD_ENABLED}
      - DE_FOMC_BLOCK_DAYS=${DE_FOMC_BLOCK_DAYS}
      - DE_FOMC_GUARD_ENABLED=${DE_FOMC_GUARD_ENABLED}
      - DE_MACRO_BLOCK_DAYS=${DE_MACRO_BLOCK_DAYS}
      - DE_MACRO_GUARD_ENABLED=${DE_MACRO_GUARD_ENABLED}
      - DE_ORDER_TIF=${DE_ORDER_TIF}
      - EARNINGS_BLOCK_WEEKS=${EARNINGS_BLOCK_WEEKS}
      - FMP_API_KEY=${FMP_API_KEY}
      - IBKRBRIDGE_URL=${IBKRBRIDGE_URL}
      - LIQUIDITYMANAGER_URL=${LIQUIDITYMANAGER_URL}
      - LIVEMARKETLISTNER_URL=${LIVEMARKETLISTNER_URL}
      - LIVE_INTRADAY_TF=${LIVE_INTRADAY_TF}
      - LIVE_RECALC_INTERVAL_MS=${LIVE_RECALC_INTERVAL_MS}
      - LIVE_SIGNAL_CANDLE_CACHE_TTL_MS=${LIVE_SIGNAL_CANDLE_CACHE_TTL_MS}
      - MARKETDATASERVICE_URL=${MARKETDATASERVICE_URL}
      - MARKETSIMULATOR_URL=${MARKETSIMULATOR_URL}
      - MARKET_OPEN_UTC=${MARKET_OPEN_UTC}
      - MAX_RETRY_DELAY=${MAX_RETRY_DELAY}
      - MICROSERVICE_NAME=${MICROSERVICE_NAME}
      - ORDERLISTNER_URL=${ORDERLISTNER_URL}
      - ORDERSIMULATOR_URL=${ORDERSIMULATOR_URL}
      - PORT=${PORT:-3018}
      - REDIS_URL=${REDIS_URL}
      - RISK_ON_TTL_MS=${RISK_ON_TTL_MS}
      - SCHEDULER_URL=${SCHEDULER_URL}
      - SERVICECONTROLPLANE_URL=${SERVICECONTROLPLANE_URL}
      - SLTP_URL=${SLTP_URL}
      - SMA_URL=${SMA_URL}
      - STRATEGYUTILS_URL=${STRATEGYUTILS_URL}
      - TICKERSCANNER_TIMEOUT_MS=${TICKERSCANNER_TIMEOUT_MS}
      - TICKERSCANNER_URL=${TICKERSCANNER_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - TZ=${TIMEZONE}
      - CACHEMANAGER_TIMEOUT_MS=${CACHEMANAGER_TIMEOUT_MS:-120000}
    depends_on:
      datahub:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
      - traefik_web
    profiles: ["decision-engine"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3018/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decision-engine.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/decision-engine`)"
      - "traefik.http.routers.decision-engine.entrypoints=websecure"
      - "traefik.http.routers.decision-engine.tls.certresolver=le"
      - "traefik.http.services.decision-engine.loadbalancer.server.port=3018"
      - "traefik.http.middlewares.decision-engine-stripprefix.stripPrefix.prefixes=/decision-engine"
      - "traefik.http.routers.decision-engine.middlewares=decision-engine-stripprefix,trading-cors@docker,trading-auth@docker"
      - "traefik.http.routers.decision-engine-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/decision-engine`) && Method(`OPTIONS`)"
      - "traefik.http.routers.decision-engine-preflight.entrypoints=websecure"
      - "traefik.http.routers.decision-engine-preflight.tls.certresolver=le"
      - "traefik.http.routers.decision-engine-preflight.priority=10000"
      - "traefik.http.routers.decision-engine-preflight.service=decision-engine"
      - "traefik.http.routers.decision-engine-preflight.middlewares=decision-engine-stripprefix,trading-cors@docker"

  market-data-service:
    image: expovin/market-data-service:${MARKETDATASERVICE_VERSION}
    restart: unless-stopped
    environment:
      - DATAHUB_URL=${DATAHUB_URL}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - IBKRGW_BASE_URL=${IBKRGW_BASE_URL}
      - IBKR_REQUEST_TIMEOUT_MS=${IBKR_REQUEST_TIMEOUT_MS}
      - IBKR_INSECURE_TLS=${IBKR_INSECURE_TLS}
      - IBKR_BRIDGE_URL=${IBKRBRIDGE_URL}
      - TZ=${TIMEZONE}
    depends_on:
      datahub:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
      - traefik_web
    profiles: ["market-data-service"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-data-service.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/market-data-service`)"
      - "traefik.http.routers.market-data-service.entrypoints=websecure"
      - "traefik.http.routers.market-data-service.tls.certresolver=le"
      - "traefik.http.services.market-data-service.loadbalancer.server.port=3020"
      - "traefik.http.middlewares.market-data-service-stripprefix.stripPrefix.prefixes=/market-data-service"
      - "traefik.http.routers.market-data-service.middlewares=market-data-service-stripprefix,trading-cors@docker,trading-auth@docker"
      - "traefik.http.routers.market-data-service-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/market-data-service`) && Method(`OPTIONS`)"
      - "traefik.http.routers.market-data-service-preflight.entrypoints=websecure"
      - "traefik.http.routers.market-data-service-preflight.tls.certresolver=le"
      - "traefik.http.routers.market-data-service-preflight.priority=10000"
      - "traefik.http.routers.market-data-service-preflight.service=market-data-service"
      - "traefik.http.routers.market-data-service-preflight.middlewares=market-data-service-stripprefix,trading-cors@docker"

  redis-ws-bridge:
    image: expovin/redis-ws-bridge:${REDISWSBRIDGE_VERSION}
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATAHUB_URL=${DATAHUB_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - REDIS_PATTERNS=${REDIS_PATTERNS}
      - TZ=${TIMEZONE}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
      - traefik_web
    profiles: ["redis-ws-bridge"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-ws-bridge.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge`)"
      - "traefik.http.routers.redis-ws-bridge.entrypoints=websecure"
      - "traefik.http.routers.redis-ws-bridge.tls.certresolver=le"
      - "traefik.http.services.redis-ws-bridge.loadbalancer.server.port=3030"
      - "traefik.http.middlewares.redis-ws-bridge-stripprefix.stripPrefix.prefixes=/redis-ws-bridge"
      - "traefik.http.routers.redis-ws-bridge.middlewares=redis-ws-bridge-stripprefix,trading-cors@docker,trading-auth@docker"
      - "traefik.http.routers.redis-ws-bridge-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge`) && Method(`OPTIONS`)"
      - "traefik.http.routers.redis-ws-bridge-preflight.entrypoints=websecure"
      - "traefik.http.routers.redis-ws-bridge-preflight.tls.certresolver=le"
      - "traefik.http.routers.redis-ws-bridge-preflight.priority=10000"
      - "traefik.http.routers.redis-ws-bridge-preflight.service=redis-ws-bridge"
      - "traefik.http.routers.redis-ws-bridge-preflight.middlewares=redis-ws-bridge-stripprefix,trading-cors@docker"
      - "traefik.http.routers.redis-ws-bridge-ws.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge/ws`)"
      - "traefik.http.routers.redis-ws-bridge-ws.entrypoints=websecure"
