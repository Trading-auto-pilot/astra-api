name: "${ENV}"

services:

  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # Provider Docker
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=trading_net"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Redirect HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let’s Encrypt (ACME via HTTP-01)
      - "--certificatesresolvers.le.acme.email=expovin@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"

      # Dashboard (puoi disabilitarla in produzione o proteggerla via IP)
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # log (opzionale)
      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net

    labels:
      - "traefik.enable=true"

      # 🔐 middleware di autenticazione → chiama authService /auth/validate
      - "traefik.http.middlewares.auth-forward.forwardauth.address=http://authservice:3015/auth/validate"
      - "traefik.http.middlewares.auth-forward.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth-forward.forwardauth.authResponseHeaders=X-User-Id,X-Auth-Subject-Type,X-Api-Key-Id"

      # CORS Configuration
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowOriginList=https://trading.expovin.it,https://api.trading.expovin.it,http://localhost:5173,http://localhost:8080"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowMethods=GET,OPTIONS,PUT,POST,DELETE"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,X-Api-Key"
      - "traefik.http.middlewares.cors-default.headers.accessControlAllowCredentials=true"

  # ======================
  # CORE SERVICES (sempre ON)
  # ======================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT : ${MYSQL_PORT}
      MYSQL_HOST : ${MYSQL_HOST}
      TZ: Asia/Dubai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "3306:3306"
    depends_on:
      redis:
          condition: service_healthy
    volumes:
      - trading-system_mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "no",
        "--save", "",
        "--maxmemory", "512mb",
        "--maxmemory-policy", "allkeys-lru"
      ]
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - TZ=Asia/Dubai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - trading_net

  ibkrgw-paper:
    image: expovin/ibkr-clientportal:${IBKRGW_VERSION}
    restart: unless-stopped
    networks:
      - trading_net
    ports:
      - "5001:5000"
    volumes:
      - ./IBKR_API_Gateway/conf.local.expopaper.yaml:/opt/ibkr/root/conf.yaml:ro
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.ibkrgw-expopaper.rule=Host(`expopaper.localhost`)"
      - "traefik.http.routers.ibkrgw-expopaper.entrypoints=websecure"
      - "traefik.http.routers.ibkrgw-expopaper.tls=true"

      - "traefik.http.routers.ibkrgw-expopaper.middlewares=ibkrgw-expopaper-headers"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-Host=localhost:5000"

      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.port=5000"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.server.scheme=https"
      - "traefik.http.services.ibkrgw-expopaper.loadbalancer.serversTransport=ibkr-insecure@file"

      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Forwarded-For=127.0.0.1"
      - "traefik.http.middlewares.ibkrgw-expopaper-headers.headers.customRequestHeaders.X-Real-IP=127.0.0.1"

  ibkr-keepalive:
    image: expovin/ibkr-keepalive:${IBKRKEEPALIVE_VERSION}
    container_name: ibkr-keepalive
    network_mode: "service:ibkrgw-paper"
    depends_on:
      - ibkrgw-paper
    environment:
      - IBKR_BASE_URL=http://localhost:5000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - KEEPALIVE_INTERVAL_MS=45000
      - REQUEST_TIMEOUT_MS=5000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ibkr-keepalive.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-keepalive`)"
      - "traefik.http.routers.ibkr-keepalive.entrypoints=websecure"
      - "traefik.http.routers.ibkr-keepalive.tls.certresolver=le"
      - "traefik.http.services.ibkr-keepalive.loadbalancer.server.port=3019"
      - "traefik.http.middlewares.ibkr-keepalive-stripprefix.stripPrefix.prefixes=/ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive.middlewares=ibkr-keepalive-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.ibkr-keepalive-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-keepalive`) && Method(`OPTIONS`)"
      - "traefik.http.routers.ibkr-keepalive-preflight.entrypoints=websecure"
      - "traefik.http.routers.ibkr-keepalive-preflight.tls.certresolver=le"
      - "traefik.http.routers.ibkr-keepalive-preflight.priority=10000"
      - "traefik.http.routers.ibkr-keepalive-preflight.service=ibkr-keepalive"
      - "traefik.http.routers.ibkr-keepalive-preflight.middlewares=ibkr-keepalive-stripprefix,cors-default@docker"

  dbmanager:
    image: expovin/dbmanager:${DBMANAGER_VERSION}
    restart: unless-stopped
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Dubai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cache_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_net
    labels:
      - "traefik.enable=true"
      # Router: https://api.trading.expovin.it/dbmanager/...
      - "traefik.http.routers.dbmanager.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/dbmanager`)"
      - "traefik.http.routers.dbmanager.entrypoints=websecure"
      - "traefik.http.routers.dbmanager.tls.certresolver=le"
      # Service: porta interna del container
      - "traefik.http.services.dbmanager.loadbalancer.server.port=3002"
      - "traefik.http.middlewares.dbmanager-stripprefix.stripPrefix.prefixes=/dbmanager"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.dbmanager.middlewares=dbmanager-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.dbmanager-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/dbmanager`) && Method(`OPTIONS`)"
      - "traefik.http.routers.dbmanager-preflight.entrypoints=websecure"
      - "traefik.http.routers.dbmanager-preflight.tls.certresolver=le"
      - "traefik.http.routers.dbmanager-preflight.priority=10000"
      - "traefik.http.routers.dbmanager-preflight.service=dbmanager"
      - "traefik.http.routers.dbmanager-preflight.middlewares=dbmanager-stripprefix,cors-default@docker"

  # ======================
  # MICROSERVIZI ABILITABILI (via profiles)
  # ======================

  cachemanager:
    image: expovin/cachemanager:${CACHEMANAGER_VERSION}
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - REDIS_URL=redis://redis:6379
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - IBKR_BRIDGE_URL=${IBKRBRIDGE_URL}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - cachemanager_data:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net
    profiles: ["cachemanager"]
    labels:
      - "traefik.enable=true"
      # Router: https://api.trading.expovin.it/cachemanager/...
      - "traefik.http.routers.cachemanager.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/cachemanager`)"
      - "traefik.http.routers.cachemanager.entrypoints=websecure"
      - "traefik.http.routers.cachemanager.tls.certresolver=le"
      # Service: porta interna del container
      - "traefik.http.services.cachemanager.loadbalancer.server.port=3006"
      # ✅ Middleware corretto: stripPrefix (camelCase)
      - "traefik.http.middlewares.cachemanager-stripprefix.stripPrefix.prefixes=/cachemanager"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.cachemanager.middlewares=cachemanager-stripprefix,cors-default@docker,auth-forward@docker"

  decision-engine:
    image: expovin/decision-engine:${DECISIONENGINE_VERSION}
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["decision-engine"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3018/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decision-engine.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/decision-engine`)"
      - "traefik.http.routers.decision-engine.entrypoints=websecure"
      - "traefik.http.routers.decision-engine.tls.certresolver=le"
      - "traefik.http.services.decision-engine.loadbalancer.server.port=3018"
      - "traefik.http.middlewares.decision-engine-stripprefix.stripPrefix.prefixes=/decision-engine"
      - "traefik.http.routers.decision-engine.middlewares=decision-engine-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.decision-engine-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/decision-engine`) && Method(`OPTIONS`)"
      - "traefik.http.routers.decision-engine-preflight.entrypoints=websecure"
      - "traefik.http.routers.decision-engine-preflight.tls.certresolver=le"
      - "traefik.http.routers.decision-engine-preflight.priority=10000"
      - "traefik.http.routers.decision-engine-preflight.service=decision-engine"
      - "traefik.http.routers.decision-engine-preflight.middlewares=decision-engine-stripprefix,cors-default@docker"

  market-data-service:
    image: expovin/market-data-service:${MARKETDATASERVICE_VERSION}
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - IBKRGW_BASE_URL=${IBKRGW_URL}
      - IBKR_INSECURE_TLS=${IBKR_INSECURE_TLS}
      - IBKR_BRIDGE_URL=${IBKRBRIDGE_URL}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["market-data-service"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-data-service.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/market-data-service`)"
      - "traefik.http.routers.market-data-service.entrypoints=websecure"
      - "traefik.http.routers.market-data-service.tls.certresolver=le"
      - "traefik.http.services.market-data-service.loadbalancer.server.port=3020"
      - "traefik.http.middlewares.market-data-service-stripprefix.stripPrefix.prefixes=/market-data-service"
      - "traefik.http.routers.market-data-service.middlewares=market-data-service-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.market-data-service-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/market-data-service`) && Method(`OPTIONS`)"
      - "traefik.http.routers.market-data-service-preflight.entrypoints=websecure"
      - "traefik.http.routers.market-data-service-preflight.tls.certresolver=le"
      - "traefik.http.routers.market-data-service-preflight.priority=10000"
      - "traefik.http.routers.market-data-service-preflight.service=market-data-service"
      - "traefik.http.routers.market-data-service-preflight.middlewares=market-data-service-stripprefix,cors-default@docker"

  redis-ws-bridge:
    image: expovin/redis-ws-bridge:${REDISWSBRIDGE_VERSION}
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - REDIS_PATTERNS=${REDIS_PATTERNS}
      - TZ=Asia/Dubai
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["redis-ws-bridge"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-ws-bridge.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge`)"
      - "traefik.http.routers.redis-ws-bridge.entrypoints=websecure"
      - "traefik.http.routers.redis-ws-bridge.tls.certresolver=le"
      - "traefik.http.services.redis-ws-bridge.loadbalancer.server.port=3030"
      - "traefik.http.middlewares.redis-ws-bridge-stripprefix.stripPrefix.prefixes=/redis-ws-bridge"
      - "traefik.http.routers.redis-ws-bridge.middlewares=redis-ws-bridge-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.redis-ws-bridge-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge`) && Method(`OPTIONS`)"
      - "traefik.http.routers.redis-ws-bridge-preflight.entrypoints=websecure"
      - "traefik.http.routers.redis-ws-bridge-preflight.tls.certresolver=le"
      - "traefik.http.routers.redis-ws-bridge-preflight.priority=10000"
      - "traefik.http.routers.redis-ws-bridge-preflight.service=redis-ws-bridge"
      - "traefik.http.routers.redis-ws-bridge-preflight.middlewares=redis-ws-bridge-stripprefix,cors-default@docker"
      - "traefik.http.routers.redis-ws-bridge-ws.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/redis-ws-bridge/ws`)"
      - "traefik.http.routers.redis-ws-bridge-ws.entrypoints=websecure"
      - "traefik.http.routers.redis-ws-bridge-ws.tls.certresolver=le"
      - "traefik.http.routers.redis-ws-bridge-ws.priority=10001"
      - "traefik.http.routers.redis-ws-bridge-ws.service=redis-ws-bridge"
      - "traefik.http.routers.redis-ws-bridge-ws.middlewares=redis-ws-bridge-stripprefix,cors-default@docker"

  ibkr-bridge:
    image: expovin/ibkr-bridge:${IBKRBRIDGE_VERSION}
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - IBKRGW_BASE_URL=${IBKRGW_BASE_URL}
      - IBKR_INSECURE_TLS=${IBKR_INSECURE_TLS}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TICKLE_INTERVAL_MS=${TICKLE_INTERVAL_MS}
      - AUTH_CHECK_INTERVAL_MS=${AUTH_CHECK_INTERVAL_MS}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["ibkr-bridge"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3017/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ibkr-bridge.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-bridge`)"
      - "traefik.http.routers.ibkr-bridge.entrypoints=websecure"
      - "traefik.http.routers.ibkr-bridge.tls.certresolver=le"
      - "traefik.http.services.ibkr-bridge.loadbalancer.server.port=3017"
      - "traefik.http.middlewares.ibkr-bridge-stripprefix.stripPrefix.prefixes=/ibkr-bridge"
      - "traefik.http.routers.ibkr-bridge.middlewares=ibkr-bridge-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.ibkr-bridge-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/ibkr-bridge`) && Method(`OPTIONS`)"
      - "traefik.http.routers.ibkr-bridge-preflight.entrypoints=websecure"
      - "traefik.http.routers.ibkr-bridge-preflight.tls.certresolver=le"
      - "traefik.http.routers.ibkr-bridge-preflight.priority=10000"
      - "traefik.http.routers.ibkr-bridge-preflight.service=ibkr-bridge"
      - "traefik.http.routers.ibkr-bridge-preflight.middlewares=ibkr-bridge-stripprefix,cors-default@docker"

  alertingservice:
    image: expovin/alertingservice:${ALERTINGSERVICE_VERSION}
    restart: unless-stopped
    depends_on:
      - dbmanager
    networks:
      - trading_net
    profiles: ["alertingservice"]
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PORT=3008
      - ENV=${ENV}
      - MAX_RETRY_DELAY=${MAX_RETRY_DELAY}
      - REDIS_URL=redis://redis:6379
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_CONTENT_SID=${TWILIO_CONTENT_SID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ALERTING_LOGS_PATTERN=${ALERTING_LOGS_PATTERN}
      - ALERTING_WINDOW_SECONDS=${ALERTING_WINDOW_SECONDS}
      - ALERTING_MAX_PER_WINDOW=${ALERTING_MAX_PER_WINDOW}
      - ALERTING_DEDUP_SECONDS=${ALERTING_DEDUP_SECONDS}
      - ALERTING_DEFAULT_EMAIL_TO=${ALERTING_DEFAULT_EMAIL_TO}
      - TZ=Asia/Dubai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertingservice.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/alertingservice`)"
      - "traefik.http.routers.alertingservice.entrypoints=websecure"
      - "traefik.http.routers.alertingservice.tls.certresolver=le"
      - "traefik.http.services.alertingservice.loadbalancer.server.port=3008"
      - "traefik.http.middlewares.alertingservice-stripprefix.stripPrefix.prefixes=/alertingservice"
      - "traefik.http.routers.alertingservice.middlewares=alertingservice-stripprefix,cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.alertingservice-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/alertingservice`) && Method(`OPTIONS`)"
      - "traefik.http.routers.alertingservice-preflight.entrypoints=websecure"
      - "traefik.http.routers.alertingservice-preflight.tls.certresolver=le"
      - "traefik.http.routers.alertingservice-preflight.priority=10000"
      - "traefik.http.routers.alertingservice-preflight.service=alertingservice"
      - "traefik.http.routers.alertingservice-preflight.middlewares=alertingservice-stripprefix,cors-default@docker"

  scheduler:
    image: expovin/scheduler:${SCHEDULER_VERSION}
    restart: unless-stopped
    depends_on:
      dbmanager:
          condition: service_healthy
    networks:
      - trading_net
    profiles: ["scheduler"]
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - TZ=Asia/Dubai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3014/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # Router: https://api.trading.expovin.it/scheduler/...
      - "traefik.http.routers.scheduler.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/scheduler`)"
      - "traefik.http.routers.scheduler.entrypoints=websecure"
      - "traefik.http.routers.scheduler.tls.certresolver=le"
      # ⚠️ Sostituisci 3010 con la porta interna reale del tuo scheduler
      - "traefik.http.services.scheduler.loadbalancer.server.port=3014"
      # Strip del prefisso /scheduler
      - "traefik.http.middlewares.scheduler-stripprefix.stripPrefix.prefixes=/scheduler"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.scheduler.middlewares=scheduler-stripprefix,cors-default@docker,auth-forward@docker"

  tickerscanner:
    image: expovin/tickerscanner:${TICKERSCANNER_VERSION}
    restart: unless-stopped
    environment:
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - FMP_API_KEY=${FMP_API_KEY}
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
          condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    profiles: ["tickerscanner"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tickerscanner.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/tickerscanner`)"
      - "traefik.http.routers.tickerscanner.entrypoints=websecure"
      - "traefik.http.routers.tickerscanner.tls.certresolver=le"
      - "traefik.http.services.tickerscanner.loadbalancer.server.port=3013"
      - "traefik.http.middlewares.tickerscanner-stripprefix.stripPrefix.prefixes=/tickerscanner"
      # 🔐 protetto via forwardAuth → /auth/validate
      - "traefik.http.routers.tickerscanner.middlewares=tickerscanner-stripprefix,cors-default@docker,auth-forward@docker"

  servicecontrolplane:
    image: expovin/servicecontrolplane:${SERVICECONTROLPLANE_VERSION}
    restart: unless-stopped
    profiles: ["servicecontrolplane"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - REDIS_URL=redis://redis:6379
      - DBMANAGER_URL=http://dbmanager:3002
      - CACHEMANAGER_URL=http://cachemanager:3006
      - ALERTINGSERVICE_URL=http://alertingservice:3008
      - TICKERSCANNER_URL=http://tickerscanner:3013
      - SCHEDULER_URL=http://scheduler:3014
      - AUTHSERVICE_URL=http://authService:3015
      - TZ=Asia/Dubai
    depends_on:
      dbmanager:
          condition: service_healthy
      redis:
          condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - trading_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/status/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servicecontrolplane.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/servicecontrolplane`)"
      - "traefik.http.routers.servicecontrolplane.entrypoints=websecure"
      - "traefik.http.routers.servicecontrolplane.tls.certresolver=le"
      - "traefik.http.services.servicecontrolplane.loadbalancer.server.port=3016"
      - "traefik.http.middlewares.servicecontrolplane-stripprefix.stripPrefix.prefixes=/servicecontrolplane"
      - "traefik.http.routers.servicecontrolplane.middlewares=servicecontrolplane-stripprefix,cors-default@docker,auth-forward@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.servicecontrolplane-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/servicecontrolplane`) && Method(`OPTIONS`)"
      - "traefik.http.routers.servicecontrolplane-preflight.entrypoints=websecure"
      - "traefik.http.routers.servicecontrolplane-preflight.priority=10000"
      - "traefik.http.routers.servicecontrolplane-preflight.service=servicecontrolplane"
      - "traefik.http.routers.servicecontrolplane-preflight.middlewares=servicecontrolplane-stripprefix,cors-default@docker"
      # Preflight (CORS): bypass auth-forward for browser OPTIONS requests
      - "traefik.http.routers.tickerscanner-preflight.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/tickerscanner`) && Method(`OPTIONS`)"
      - "traefik.http.routers.tickerscanner-preflight.entrypoints=websecure"
      - "traefik.http.routers.tickerscanner-preflight.priority=10000"
      - "traefik.http.routers.tickerscanner-preflight.service=tickerscanner"
      - "traefik.http.routers.tickerscanner-preflight.middlewares=tickerscanner-stripprefix,cors-default@docker"
  authservice:
    image: expovin/authservice:${AUTHSERVICE_VERSION}
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - ENV=${ENV}
      - LOG_BATCH_MAX_BYTES=${LOG_BATCH_MAX_BYTES}
      - ENABLE_DB_LOG=${ENABLE_DB_LOG}
      - DBMANAGER_URL=http://dbmanager:3002
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=Asia/Dubai
    networks:
      - trading_net
    depends_on:
      dbmanager:
          condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    labels:
      - "traefik.enable=true"

      # 🔓 router PUBBLICO:
      # /auth/login e /auth/validate → niente middleware, usati da client e Traefik
      - "traefik.http.routers.auth-public.rule=Host(`api.trading.expovin.it`) && (PathPrefix(`/auth/login`) || PathPrefix(`/auth/validate`))"
      - "traefik.http.routers.auth-public.entrypoints=websecure"
      - "traefik.http.routers.auth-public.tls.certresolver=le"
      - "traefik.http.routers.auth-public.service=auth-svc"
      - "traefik.http.routers.auth-public.middlewares=cors-default@docker"

      # 🔐 router ADMIN:
      # /auth/admin/... → protetto da JWT/API_KEY via forwardAuth
      - "traefik.http.routers.auth-admin.rule=Host(`api.trading.expovin.it`) && PathPrefix(`/auth/admin`)"
      - "traefik.http.routers.auth-admin.entrypoints=websecure"
      - "traefik.http.routers.auth-admin.tls.certresolver=le"
      - "traefik.http.routers.auth-admin.middlewares=cors-default@docker,auth-forward@docker"
      - "traefik.http.routers.auth-admin.service=auth-svc"

      # service condiviso che punta alla porta interna 3015
      - "traefik.http.services.auth-svc.loadbalancer.server.port=3015"


  astraai-frontend:
    image: expovin/astraai-frontend:${ASTRAAI_VERSION}
    restart: unless-stopped
    profiles: ["frontend"]      # se usi i profiles come per gli altri
    networks:
      - trading_net             # stessa network di traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=trading_net"

      # Router frontend → trading.expovin.it
      - "traefik.http.routers.astraai-frontend.rule=Host(`trading.expovin.it`)"
      - "traefik.http.routers.astraai-frontend.entrypoints=websecure"
      - "traefik.http.routers.astraai-frontend.tls=true"
      - "traefik.http.routers.astraai-frontend.tls.certresolver=le"

      # (opzionale) redirect http→https se non già fatto a livello globale
      #- "traefik.http.routers.astraai-frontend-web.rule=Host(`trading.expovin.it`)"
      #- "traefik.http.routers.astraai-frontend-web.entrypoints=web"
      - "traefik.http.routers.astraai-frontend-web.middlewares=cors-default@docker"


volumes:
  trading-system_mysql_data:
    external: true
  redis-data:
  shared_cache_data:
    external: true
  traefik_letsencrypt:
  cache_data:
    driver: local
  cachemanager_data:

networks:
  trading_net:
    name:  trading_net
    driver: bridge
